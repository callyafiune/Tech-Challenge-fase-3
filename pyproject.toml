[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "medical-classifier"
version = "0.1.0"
description = "Classificação de resumos médicos com inferência ONNX e observabilidade"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116,<0.117", "uvicorn>=0.35,<0.36",
  "prometheus-client>=0.22,<0.23", "scikit-learn>=1.7,<1.8",
  "numpy>=2.2,<2.3", "pandas>=2.3,<2.4", "joblib>=1.5,<1.6",
  "onnx>=1.19,<1.20", "onnxruntime>=1.23,<1.24", "skl2onnx>=1.19,<1.20",
  "httpx>=0.28,<0.29",
  "threadpoolctl>=3.6,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.13,<0.14", "pyyaml>=6,<7", "hatchling>=1.27,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/medical_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integracao: depende do corpus e dos artefatos locais"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
