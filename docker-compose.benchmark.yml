services:
  api-original:
    image: medical-classifier-treino:local
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MODEL_DIR: /app/models
      MODEL_BACKEND: sklearn
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - modelos:/app/models:ro
    depends_on:
      pipeline:
        condition: service_completed_successfully
