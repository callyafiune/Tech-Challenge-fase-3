name: Conferir implantação e acesso público

on:
  push:
    branches: [diagnostico/ssm-recibo]

permissions:
  contents: read
  id-token: write

concurrency:
  group: implantacao-aws
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Autenticar as consultas por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: consulta-rede-${{ github.run_id }}
      - name: Consultar resultado SSM e regras sem alterar a instância
        shell: python
        run: |
          import json
          import re
          import subprocess
          import urllib.request

          def consultar(*argumentos):
              resultado = subprocess.run(
                  ['aws', '--region', 'eu-west-1', '--no-cli-pager',
                   '--cli-connect-timeout', '5', '--cli-read-timeout', '10',
                   *argumentos, '--output', 'json'],
                  capture_output=True, text=True, timeout=20,
              )
              if resultado.returncode:
                  erro = re.search(r'An error occurred \(([A-Za-z0-9]+)\)', resultado.stderr)
                  print(json.dumps({'consulta': argumentos[:2], 'erro': erro.group(1) if erro else 'nao_identificado'}))
                  return None
              return json.loads(resultado.stdout)

          identidade = consultar('sts', 'get-caller-identity')
          if not identidade or identidade['Account'] != '076516546831':
              raise RuntimeError('Conta AWS diferente da esperada.')
          invocacao = consultar(
              'ssm', 'get-command-invocation', '--command-id',
              'd07e9d05-210f-4dfb-a000-484192c1c3b8',
              '--instance-id', 'i-024a7c79b3ec2bfa1',
          )
          if invocacao:
              resumo = {k: invocacao.get(k) for k in (
                  'CommandId', 'Status', 'ResponseCode', 'ExecutionStartDateTime', 'ExecutionEndDateTime')}
              remoto = json.loads(invocacao.get('StandardOutputContent') or '{}')
              resumo['remoto'] = {k: remoto.get(k) for k in (
                  'sucesso', 'revisao', 'versao_modelo', 'receipt')}
              print(json.dumps({'invocacao': resumo}, ensure_ascii=False))
          resposta = consultar('ec2', 'describe-instances', '--instance-ids', 'i-024a7c79b3ec2bfa1')
          if resposta:
              instancia = resposta['Reservations'][0]['Instances'][0]
              grupos = [g['GroupId'] for g in instancia['SecurityGroups']]
              print(json.dumps({'instancia': instancia['InstanceId'], 'ip_publico': instancia.get('PublicIpAddress'), 'grupos': grupos}))
              regras = consultar('ec2', 'describe-security-groups', '--group-ids', *grupos)
              if regras:
                  for grupo in regras['SecurityGroups']:
                      print(json.dumps({'grupo': grupo['GroupId'], 'entradas': grupo['IpPermissions']}))
          for endereco in ('https://checkip.amazonaws.com', 'http://54.246.245.167:8000/health', 'http://54.246.245.167:8000/ready'):
              try:
                  with urllib.request.urlopen(endereco, timeout=10) as resposta:
                      conteudo = resposta.read(2048).decode('utf-8')
                      print(json.dumps({'url': endereco, 'codigo': resposta.status, 'resposta': conteudo}, ensure_ascii=False))
              except Exception as erro:
                  print(json.dumps({'url': endereco, 'erro': type(erro).__name__}))
