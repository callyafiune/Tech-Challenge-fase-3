name: Integração contínua

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      imagem_artefato_id:
        description: Identificador do artefato produzido pela validação concluída.
        value: ${{ jobs.qualidade.outputs.imagem_artefato_id }}

permissions:
  contents: read

jobs:
  qualidade:
    name: Testes, contêineres e retreino real
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      imagem_artefato_id: ${{ steps.imagem_validada.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    env:
      GRAFANA_ADMIN_PASSWORD: senha-local-do-runner-ci
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Obter o código desta revisão
        uses: actions/checkout@v4
      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Instalar as dependências fixadas
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Executar análise estática e testes
        run: |
          mkdir -p reports
          python -m ruff check src tests scripts dags
          python -m ruff format --check src tests scripts dags
          python -m pytest -q --junitxml=reports/testes.xml
      - name: Validar as configurações Compose
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.benchmark.yml config --quiet
          docker compose -f docker-compose.airflow.yml config --quiet
      - name: Construir as imagens de inferência e treinamento
        run: |
          docker compose build api pipeline
      - name: Conferir dependências, imports e inventários das imagens
        run: |
          mkdir -p reports/imagens
          for perfil in runtime treinamento; do
            if [ "$perfil" = runtime ]; then
              imagem=medical-classifier:local
            else
              imagem=medical-classifier-treino:local
            fi
            docker image inspect "$imagem" --format '{"id": {{json .Id}}, "bytes": {{.Size}}}' > "reports/imagens/$perfil-imagem.json"
            docker run --rm --network none --read-only --entrypoint /usr/local/bin/python "$imagem" -m pip --python /opt/venv/bin/python check
            docker run --rm -i --network none --read-only --entrypoint python "$imagem" - --perfil "$perfil" < scripts/verificar_dependencias_imagem.py > "reports/imagens/$perfil-dependencias.json"
          done
      - name: Construir o Airflow com o ambiente de treinamento
        run: |
          docker compose create pipeline
          docker compose -f docker-compose.airflow.yml build airflow
      - name: Importar a DAG com o Airflow real
        run: |
          docker compose -f docker-compose.airflow.yml run --rm -T airflow python - <<'PY'
          from airflow.models import DagBag
          bag = DagBag(dag_folder="/opt/airflow/dags", include_examples=False)
          assert not bag.import_errors, bag.import_errors
          dag = bag.dags["retreino_medico"]
          assert set(dag.task_ids) == {"ingestao", "treinamento", "validacao", "publicacao"}
          assert dag.max_active_runs == 1 and dag.catchup is False
          assert dag.get_task("publicacao").upstream_task_ids == {"validacao"}
          assert dag.get_task("validacao").upstream_task_ids == {"treinamento"}
          assert dag.get_task("treinamento").upstream_task_ids == {"ingestao"}
          assert all(task.retries == 1 for task in dag.tasks)
          print("DAG importada e dependências verificadas no Airflow real.")
          PY
      - name: Executar as quatro etapas sobre o corpus público
        run: |
          docker compose -f docker-compose.airflow.yml run --rm airflow airflow db migrate
          docker compose -f docker-compose.airflow.yml run --rm airflow airflow dags test retreino_medico 2026-09-14 2>&1 | tee reports/airflow-dag.log
          docker compose -f docker-compose.airflow.yml run --rm -T airflow python - <<'PY'
          from airflow.models.dagrun import DagRun
          from airflow.utils.session import create_session
          with create_session() as session:
              run = session.query(DagRun).filter(DagRun.dag_id == "retreino_medico").one()
              assert run.state == "success", run.state
          print("As quatro etapas da DAG terminaram com sucesso.")
          PY
      - name: Iniciar API, Prometheus e Grafana com a versão publicada
        run: docker compose up -d --no-deps api prometheus grafana
      - name: Verificar a stack de ponta a ponta
        run: python scripts/smoke_stack.py --tempo-limite 120 --saida reports/smoke_stack.json
      - name: Preservar a imagem que passou em todas as verificações
        run: |
          mkdir -p imagem
          docker image inspect medical-classifier:local --format '{{.Id}}' > imagem/id.txt
          docker save medical-classifier:local | gzip -1 > imagem/classificador.tar.gz
          sha256sum imagem/classificador.tar.gz > imagem/classificador.tar.gz.sha256
      - name: Disponibilizar a imagem validada para entrega
        id: imagem_validada
        uses: actions/upload-artifact@v4
        with:
          name: imagem-validada-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: imagem/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Recolher relatórios e logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/stack.log 2>&1 || true
          docker compose -f docker-compose.airflow.yml logs --no-color > reports/airflow.log 2>&1 || true
          if docker image inspect medical-classifier:local > /dev/null 2>&1; then
            docker run --rm -i --user "$(id -u):$(id -g)" --volume medical-classifier_dados:/dados:ro --volume "$PWD/reports:/destino" --entrypoint python medical-classifier:local - <<'PY'
          from pathlib import Path
          import shutil
          for arquivo in Path("/dados/runs").glob("*/reports/*.json"):
              destino = Path("/destino") / f"{arquivo.parents[1].name}-{arquivo.name}"
              shutil.copy2(arquivo, destino)
          PY
          fi
      - name: Preservar evidências da execução
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Encerrar os serviços do runner
        if: always()
        run: |
          docker compose -f docker-compose.airflow.yml down --volumes --remove-orphans
          docker compose down --volumes --remove-orphans
